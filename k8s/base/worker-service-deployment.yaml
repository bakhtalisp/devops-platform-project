apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  labels:
    app: worker-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      initContainers:
        - name: wait-for-api-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z api-service 5000; do echo waiting for api-service; sleep 2; done"
      containers:
        - name: worker-service
          image: worker-service:v1
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          imagePullPolicy: Never
