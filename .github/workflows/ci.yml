name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/api-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: services/api-service
        run: pytest

  build-and-scan:
    needs: test-api-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api-service image
        run: docker build -t api-service:ci -f services/api-service/Dockerfile services/api-service

      - name: Build worker-service image
        run: docker build -t worker-service:ci -f services/worker-service/Dockerfile services/worker-service

      - name: Run Trivy vulnerability scan (api-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "api-service:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Run Trivy vulnerability scan (worker-service)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "worker-service:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
